<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO Pulse - April 1, 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f0f3f8;
            max-width: 680px;
            margin: 0 auto;
            font-family: 'Inter', sans-serif;
        }
        header {
            background: #060e1f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            text-transform: uppercase;
        }
        .issue-card {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }
        .digest {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .story {
            padding: 15px;
        }
        .cta {
            background: #0ea5e9;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
        .footer {
            background: #060e1f;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>GEO Pulse - April 1, 2026</h1>
    </header>
    <div class="digest">
        <h2>Digest</h2>
        <div class="issue-card">No new issues today.</div>
    </div>
    <footer class="footer">
        <p>Thank you for reading GEO Pulse!</p>
    </footer>
</body>
</html>
